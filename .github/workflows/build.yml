name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -showsdks
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project AniBoxTV.xcodeproj -scheme AniBoxTV \
            -configuration Release -sdk appletvos -destination 'generic/platform=tvOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          test -d build/Build/Products/Release-appletvos/AniBoxTV.app
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-appletvos/AniBoxTV.app Payload/
          zip -qry AniBoxTV-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AniBoxTV-unsigned-ipa
          path: AniBoxTV-unsigned.ipa
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AniBoxTV build ${{ github.run_number }}
          files: AniBoxTV-unsigned.ipa
